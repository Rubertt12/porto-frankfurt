[package]
name = "porto-frankfurt"
version = "1.0.0"
description = "Porto Frankfurt Desktop"
authors = ["Porto Frankfurt"]
edition = "2021"

[lib]
name = "porto_frankfurt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
